name: Deploy to GitHub Pages 🚀

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🛠️ Setup R
      uses: r-lib/actions/setup-r@v2

    - name: 📦 Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2

    # ⚡ CACHE R PACKAGES (perfetto!)
    - name: 💾 Cache R packages
      uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-r-${{ hashFiles('DESCRIPTION') }}-${{ hashFiles('**/DESCRIPTION') }}
        restore-keys: ${{ runner.os }}-r-

    - name: 📦 Install packages
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: any::rmarkdown, any::knitr, any::png, any::ggplot2, any::dplyr, any::kableExtra, any::readxl, any::haven, any::xlsx, any::Hmisc, any::GGally, any::olsrr, any::ROCR, any::animation, any::tidyr, any::RColorBrewer, any::readr, any::cluster, any::factoextra, any::openxlsx, any::writexl, any::rpart, any::rpart.plot, any::caret, any::randomForest, any::e1071, any::xgboost, any::kernlab, any::psych, any::Rtsne, any::uwot, any::ca, any::pROC, any::ranger, any::car, any::lmtest, any::sandwich, any::glmnet, any::mclust, any::dbscan, any::stringr, any::forcats

    # 🔥 CACHE OUTPUTS R Markdown (GAME-CHANGER!)
    - name: 💾 Cache R Markdown (_site + _cache)
      uses: actions/cache@v4
      with:
        path: |
          docs/
          _site/
          _cache/
          **/_cache/
          **/_freeze/
        key: ${{ runner.os }}-rmd-v3-${{ hashFiles('**/*.Rmd', 'raw_data/**', '_site.yml') }}
        restore-keys: ${{ runner.os }}-rmd-

    # 🎬 RENDER SELETTIVO (FIXATO!)
    - name: 🎬 Render site (selective + cache)
      shell: bash  # ← CAMBIO CRUCIALE!
      run: |
        # Trova .Rmd modificati
        CHANGED=$(git diff --name-only HEAD~1 -- '*.Rmd' 2>/dev/null || echo "")
        
        if [ -z "$CHANGED" ]; then
          echo "✅ No .Rmd changed → full render with cache"
        else
          echo "🔄 Rendering changed only: $CHANGED"
          for file in $CHANGED; do
            Rscript -e "rmarkdown::render('$file', quiet = TRUE)"
          done
        fi
        
        # Sempre rebuild site (usa cache!)
        Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'

    - name: 📤 Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/

    - name: 🚀 Deploy
      id: deployment
      uses: actions/deploy-pages@v4
