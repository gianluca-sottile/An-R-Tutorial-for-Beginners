name: Deploy docs (incremental Rmd + render_site on _site.yml) 🚀

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup R
        uses: r-lib/actions/setup-r@v2

      - name: 📦 Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: 💾 Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('DESCRIPTION') }}-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: ${{ runner.os }}-r-

      - name: 📦 Install R packages needed for render
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # adatta la lista come preferisci
          packages: any::rmarkdown, any::knitr, any::png, any::ggplot2, any::dplyr

      - name: 💾 Cache rendered outputs (optional speedup)
        uses: actions/cache@v4
        with:
          path: |
            docs/
            _cache/
            **/_cache/
          key: ${{ runner.os }}-rmd-v1-${{ hashFiles('docs/**/*.Rmd', 'raw_data/**', '_site.yml') }}
          restore-keys: ${{ runner.os }}-rmd-

      - name: 🔎 Determine changes and render (selective or full site)
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: $GITHUB_EVENT_NAME"
          git fetch --all --tags --prune

          # Determine range for diff. For push events use github.event.before/github.sha
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            echo "Push event: BEFORE=$BEFORE AFTER=$AFTER"

            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # New branch / initial push: consider all Rmds in docs and also check _site.yml
              echo "New branch / initial push detected — treating all docs/**/*.Rmd as changed"
              CHANGED_RMDS=$(git ls-files 'docs/**/*.Rmd' || true)
              CHANGED_SITE=$(git diff --name-only HEAD -- '_site.yml' || true)
            else
              # Regular push: list changed files between BEFORE and AFTER
              CHANGED_RMDS=$(git diff --name-only "$BEFORE" "$AFTER" -- 'docs/**/*.Rmd' || true)
              CHANGED_SITE=$(git diff --name-only "$BEFORE" "$AFTER" -- '_site.yml' || true)
            fi
          else
            # workflow_dispatch or other: treat as "rebuild all"
            echo "Manual dispatch or other event — will rebuild site (render_site)"
            CHANGED_RMDS=$(git ls-files 'docs/**/*.Rmd' || true)
            CHANGED_SITE="_site.yml"
          fi

          # Normalize (remove empty lines)
          CHANGED_RMDS=$(echo "$CHANGED_RMDS" | sed '/^[[:space:]]*$/d' || true)
          CHANGED_SITE=$(echo "$CHANGED_SITE" | sed '/^[[:space:]]*$/d' || true)

          echo "Changed _site.yml entries:"
          echo "$CHANGED_SITE"
          echo "Changed Rmd files:"
          echo "$CHANGED_RMDS"

          # If _site.yml changed, do full site render (so navigation/index get updated)
          if echo "$CHANGED_SITE" | grep -q "_site.yml"; then
            echo "⚠️ _site.yml changed → running full rmarkdown::render_site() to rebuild navigation/index"
            # Renders the entire site; _site.yml should control output to docs/.
            Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'
          else
            # If there are changed Rmds, render each individually into its directory (preserve docs/)
            if [ -n "$CHANGED_RMDS" ]; then
              while IFS= read -r file; do
                # Skip empty lines
                [ -z "$file" ] && continue
                echo "→ Rendering modified Rmd: $file"
                Rscript -e "rmarkdown::render(path = '$file', output_dir = dirname('$file'), quiet = TRUE)"
              done <<< "$CHANGED_RMDS"
            else
              echo "✅ Nessun .Rmd modificato in docs/ e _site.yml non modificato → niente da renderizzare."
            fi
          fi

      - name: 📁 Copy manual static HTML into docs/
        run: |
          # crea la cartella docs/ se non esiste
          mkdir -p docs
          # copia ricorsivamente le pagine manuali dentro docs/
          # sovrascriverà eventuali file con lo stesso nome
          cp -R static_pages/* docs/ || true
          
          # opzionale: mostra cosa è stato copiato (log utile)
          echo "Manual static files copied into docs/:"
          ls -R docs | sed -n '1,200p'

      - name: 📤 Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
