project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lessons/**/*.qmd"
    - "it/**/*.qmd"
    - "!_legacy/"
    - "!_dev/"
  resources:
    - data/
    - images/

execute:
  freeze: auto        # re-run code only when a source file changes (see setup.qmd)
  warning: false
  message: false

knitr:
  opts_chunk:
    fig.align: center
    fig.width: 7
    fig.asp: 0.618
    out.width: "85%"
    dev: ragg_png
    comment: "#>"
    collapse: false

website:
  title: "From Data to Models with R"
  description: "From your first line of R to statistical modelling and machine learning — a free, open course with interactive exercises."
  site-url: https://gianluca-sottile.github.io/An-R-Tutorial-for-Beginners/
  repo-url: https://github.com/gianluca-sottile/An-R-Tutorial-for-Beginners
  repo-actions: [edit, issue]
  favicon: images/logo.svg
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true
  reader-mode: true
  search:
    location: navbar
    type: overlay
  open-graph: true

  navbar:
    logo: images/logo.svg
    title: "From Data to Models with R"
    left:
      - text: "Start here"
        href: setup.qmd
      - text: "Learning path"
        href: learning-path.qmd
      - text: "Lessons"
        href: lessons/01-foundations/01-what-is-r.qmd
      - text: "Glossary"
        href: glossary.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/gianluca-sottile/An-R-Tutorial-for-Beginners
        aria-label: GitHub repository

  sidebar:
    - id: en
      style: floating
      search: false
      collapse-level: 1
      contents:
        - section: "Level 1 · R foundations"
          contents:
