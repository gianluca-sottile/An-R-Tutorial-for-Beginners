format:
  live-html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [cosmo, assets/theme-dark.scss]
    css: assets/custom.css
    include-after-body: assets/lang-switch.html
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-tools:
      source: repo
      toggle: false
    highlight-style:
      light: github
      dark: nord
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true
    fig-cap-location: bottom
    callout-appearance: default
    grid:
      sidebar-width: 290px
      body-width: 860px
      margin-width: 260px

engine: knitr
